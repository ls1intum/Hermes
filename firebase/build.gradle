dependencies {
    implementation 'org.springframework.boot:spring-boot-starter'
    implementation 'org.springframework.boot:spring-boot-starter-web'

    implementation "com.google.firebase:firebase-admin:9.12.0"

    // Version floors for transitive dependencies of firebase-admin: they resolve older releases with known
    // vulnerabilities. Constraints raise the resolved version without adding the artifacts as direct dependencies.
    constraints {
        implementation("com.google.protobuf:protobuf-java:4.36.2") {
            because "firebase-admin resolves an older protobuf with known vulnerabilities"
        }
        implementation("com.google.protobuf:protobuf-java-util:4.36.2") {
            because "keep in sync with protobuf-java"
        }
        implementation("com.google.guava:guava:33.8.0-jre") {
            because "firebase-admin and protobuf-java-util resolve an older Guava with known vulnerabilities"
        }
    }

    implementation(project(":common"))

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

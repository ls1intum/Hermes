plugins {
    id 'org.springframework.boot'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // Metrics only: exposed in Prometheus format on a separate management port (see application.properties).
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'

    implementation(project(":common"))
    implementation(project(":apns"))
    implementation(project(":firebase"))

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Spring Boot 4 modularized the test slices; MockMvc auto-configuration lives here now.
    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
}

springBoot {
    buildInfo()
}
